{% extends 'base.html' %}

{% block scripts %}

{% endblock %}

{% block content %}
<form class="inline" id="create-project-form" onsubmit="addProject()">
    <div id="details-entry-panel">
        <h4>Name</h4>
        <input id="title" type="text" class="create-project-text">

        <h4>URL</h4>
        <input id="url" type="text" class="create-project-text">

        <h4>Created</h4>
        <input id="created" type="date" class="today">

        <h4>Updated</h4>
        <input id="updated" type="date" class="today">

        <div class="inline">
            <input id="add-another" name="add-another" type="checkbox">
            <p>Add another project</p>
        </div>

        <input type="submit" class="cta-button" value="Add Project" id="add-project-button">
    </div>

    <div class="fill-width">
        <h4>Description</h4>
        <textarea class="description-area-entry"></textarea>
    </div>
</form>

<script>
    let today = new Date().toISOString().substr(0, 10);
    let inputs = document.querySelectorAll(".today")

    console.log(inputs)

    for (let i = 0; i < inputs.length; i++) {
        inputs[i].value = today;
    }
</script>

{% endblock %}
