{% extends 'base.html' %}

{% block scripts %}

{% endblock %}

{% block content %}

<form id="login-window" class="card" onsubmit="login()">
    <h1>Sign In</h1>

    <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username">
    </div>

    <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password">
    </div>

    <button id="login-button" class="cta-button" type="submit">Sign In</button>
</form>

{% endblock %}
