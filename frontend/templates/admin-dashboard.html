{% extends 'base.html' %}

{% block scripts %}

{% endblock %}

{% block content %}

<h1>Admin Dashboard</h1>
<h2>Active Projects</h2>

<a class="basic-button" href="./add-project">+ New Project</a>

<div id="active-projects">
    {% for project in active_projects %}
    <div class="project-card">
        <p>{{ project["name"] }}</p>
        <a class="basic-button" href="./edit-project/{{ project['id'] }}">Edit</a>
        <button class="basic-button" onclick="archiveProject('{{ project['id'] }}')">Archive</button>
    </div>
    {% endfor %}
</div>

<a class="link right-align" href="./inactive-projects">View Inactive Projects →</a>

{% endblock %}
