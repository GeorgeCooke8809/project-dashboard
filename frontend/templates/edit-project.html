{% extends 'base.html' %}

{% block scripts %}
<script defer src="{{ url_for('static', filename='js/details.js') }}"></script>
<script defer src="{{ url_for('static', filename='js/editor.js') }}"></script>
{% endblock %}

{% block content %}

<a class="link" href="/admin-dashboard">← Admin dashboard</a>
<h1 class="form-heading">Edit Project</h1>

<form id="project-form" onsubmit="editProject('{{ details['id'] }}')">
    <div id="project-form-fields" class="card">
        <div class="field">
            <label for="title">Name</label>
            <input id="title" type="text" value="{{ details['name'] }}">
        </div>

        <div class="field">
            <label for="url">URL</label>
            <input id="url" type="text" value="{{ details['url'] }}">
        </div>

        <div class="field">
            <label for="github-link">GitHub</label>
            <input id="github-link" type="text" placeholder="github.com/user/repo" value="{% if details['github_link'] != None %}{{ details['github_link'] }}{% endif %}">
        </div>

        <div class="field">
            <label for="created">Created</label>
            <input id="created" type="date" value="{{ created }}">
        </div>

        <div class="field">
            <label for="updated">Updated</label>
            <input id="updated" type="date" value="{{ updated }}">
        </div>

        <div class="field">
            <label id="ai-rating-label">AI collaboration</label>

            <div id="ai-rating" class="ai-rating" role="group" aria-labelledby="ai-rating-label">
                {% for level in range(1, 6) %}
                <button type="button" class="ai-rating-box ai-rating-level-{{ level }}{% if level == details['ai_collaboration'] %} ai-rating-selected{% endif %}" aria-label="{{ level }} out of 5" onclick="setAiCollaboration({{ level }})">{{ level }}</button>
                {% endfor %}
            </div>
            <div class="ai-rating-scale">
                <span>No AI</span>
                <span>Vibe coded</span>
            </div>
        </div>

        <button type="submit" class="cta-button form-submit-button" id="edit-project-button">Edit Project</button>
    </div>

    <div id="project-form-editor" class="card">
        <div class="editor-toolbar">
            <div role="tablist" aria-label="Description editor">
                <button type="button" role="tab" id="write-tab" class="editor-tab editor-tab-active" aria-selected="true" onclick="showWriteTab()">Write</button>
                <button type="button" role="tab" id="preview-tab" class="editor-tab" aria-selected="false" onclick="showPreviewTab()">Preview</button>
            </div>

            <span class="editor-hint editor-hint-mouse">Markdown · right-click to insert</span>
            <span class="editor-hint editor-hint-touch">Markdown · long-press to insert</span>
        </div>

        <label for="description" class="editor-label">Description</label>
        <textarea id="description" class="editor-area" onkeydown="editorKeyDown()" oncontextmenu="openEditorMenu()">{% if details['description'] != None %}{{ details['description'] }}{% endif %}</textarea>

        <div id="editor-preview" class="markdown editor-hidden"></div>
    </div>
</form>

{% endblock %}
